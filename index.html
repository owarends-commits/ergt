<meta charset="utf-8">

<title>Long Tail</title>

<style>
/* Layout: one centered play column; a live long-tail curve is the hero, the prompt card sits under it, your run strip at the bottom. */
:root{
  --bg:#e9edf2; --surface:#f8fafc; --ink:#121a26; --muted:#5a6678; --line:#cfd6e0;
  --accent:#2b47e8; --tail:#d9820b; --bad:#c2352b; --good:#18804f;
  --curve-fill:rgba(43,71,232,.10); --tail-fill:rgba(217,130,11,.22);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d121b; --surface:#151c28; --ink:#e7ecf3; --muted:#93a0b4; --line:#273244;
  --accent:#7d92ff; --tail:#f2a53a; --bad:#ff7a6e; --good:#4fd08f;
  --curve-fill:rgba(125,146,255,.12); --tail-fill:rgba(242,165,58,.22); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d121b; --surface:#151c28; --ink:#e7ecf3; --muted:#93a0b4; --line:#273244;
  --accent:#7d92ff; --tail:#f2a53a; --bad:#ff7a6e; --good:#4fd08f;
  --curve-fill:rgba(125,146,255,.12); --tail-fill:rgba(242,165,58,.22); color-scheme:dark}
*{box-sizing:border-box} [hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,44px);letter-spacing:-.02em;margin:0;line-height:1}
h1 span{color:var(--tail)}
.stats{display:flex;gap:18px;font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-size:18px;display:block;font-weight:500}
.lives{display:flex;gap:5px;align-items:center;height:27px}
.life{width:12px;height:12px;border-radius:50%;background:var(--accent)}
.life.lost{background:transparent;border:2px solid var(--line)}
.curve{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px 8px}
.curve svg{width:100%;height:auto;display:block}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.prompt{font-family:var(--display);font-weight:500;font-size:clamp(26px,5vw,36px);line-height:1.15;margin:0;text-wrap:balance}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 220px;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button{font:inherit;font-weight:600;padding:12px 18px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
button.ghost{background:transparent;color:var(--muted);border-color:var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--tail);outline-offset:2px}
.hint{font-size:13px;color:var(--muted);margin:0}
.result{border-left:4px solid var(--accent);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.result.tail{border-color:var(--tail)} .result.miss{border-color:var(--bad)}
.result .big{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.result.miss .big{color:var(--bad)} .result.tail .big{color:var(--tail)}
.result p{margin:0;color:var(--muted);font-size:14px}
.result p b{color:var(--ink);font-weight:500}
.run{display:flex;gap:3px;align-items:flex-end;height:34px;flex-wrap:nowrap;overflow:hidden}
.run i{flex:0 0 8px;border-radius:2px;background:var(--accent)}
.run i.t{background:var(--tail)} .run i.x{background:var(--bad);height:4px!important}
.over{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.over h2{font-family:var(--display);font-size:32px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s 2}
@media (prefers-reduced-motion: reduce){.shake{animation:none}}
</style>

<div class="wrap">
  <header>
    <h1>Long <span>Tail</span></h1>
    <div class="stats">
      <div>score<b id="score">0</b></div>
      <div>round<b id="round">1</b></div>
      <div>best<b id="best">0</b></div>
      <div>lives<div class="lives" id="lives"></div></div>
    </div>
  </header>

  <div class="curve" aria-hidden="true">
    <svg id="curve" viewBox="0 0 600 150"></svg>
    <div class="axis"><span>Everyone says it</span><span>Almost nobody says it</span></div>
  </div>

  <section class="card" id="play">
    <div class="eyebrow" id="meta"></div>
    <h2 class="prompt" id="prompt"></h2>
    <form id="form" autocomplete="off">
      <input id="answer" placeholder="Type one answer" aria-label="Your answer" autocapitalize="off" spellcheck="false">
      <button type="submit" id="go">Answer</button>
      <button type="button" class="ghost" id="pass">Pass (−1 life)</button>
    </form>
    <p class="hint">Any correct answer counts. The less obvious it is, the more it scores. A wrong answer costs a life.</p>
    <div class="result" id="result" hidden></div>
  </section>

  <section class="over" id="over" hidden></section>

  <div>
    <div class="eyebrow" style="margin-bottom:6px">Your run</div>
    <div class="run" id="run"></div>
  </div>
</div>

function norm(s){
  return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
    .replace(/\+\+/g,"pp").replace(/#/g,"sharp").replace(/&/g," and ")
    .replace(/['’]/g,"").replace(/[^a-z0-9]+/g," ")
    .split(" ").filter(w => w && !["the","a","an","of","and","sea","ocean","st","saint"].includes(w)).join("");
}
function sing(k){ return k.length > 3 ? k.replace(/(ies)$/,"y").replace(/(ches|shes|xes|sses)$/, m => m.slice(0,-2)).replace(/s$/,"") : k; }
function lev(a,b){
  if (Math.abs(a.length-b.length) > 2) return 9;
  let p = Array.from({length:b.length+1},(_,i)=>i), pp = p;
  for (let i=1;i<=a.length;i++){ const c=[i]; for (let j=1;j<=b.length;j++){ c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); if (i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1]) c[j]=Math.min(c[j],pp[j-2]+1); } pp=p; p=c; }
  return p[b.length];
}
function match(q, input){
  const k = norm(input); if (!k) return null;
  const ks = [k, sing(k)];
  for (let i=0;i<q.answers.length;i++) for (const key of q.answers[i].keys) if (ks.includes(key) || ks.includes(sing(key))) return i;
  let best = null, bd = 9;
  for (let i=0;i<q.answers.length;i++) for (const key of q.answers[i].keys){
    if (key.length < 5) continue;
    const d = lev(k, key), tol = key.length >= 8 ? 2 : 1;
    if (d <= tol && d < bd){ bd = d; best = i; }
  }
  return best;
}

const TIERS = [[.2,"Obvious"],[.45,"Common"],[.7,"Uncommon"],[.88,"Rare"],[1.01,"Long tail"]];
const tierOf = p => TIERS.find(t => p < t[0])[1];
const pointsOf = p => Math.round(2 + 98 * Math.pow(p, 1.5));

const $ = id => document.getElementById(id);
let S, queue = [], current, locked = false;
let best = 0; try { best = +localStorage.getItem("longtail-best") || 0; } catch(e){}

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function nextQ(){
  if (!queue.length) queue = shuffle(BANK.map((_,i)=>i)).filter(i => i !== S.lastIdx);
  S.lastIdx = queue.pop(); return BANK[S.lastIdx];
}

function drawCurve(markers){
  const W=600,H=150,base=140,f=x=> base - 120*Math.exp(-3.2*x) - 4;
  let d = `M0 ${base}`; for (let x=0;x<=1.0001;x+=.01) d += ` L${(x*W).toFixed(1)} ${f(x).toFixed(1)}`; d += ` L${W} ${base} Z`;
  let tail = `M${.88*W} ${base}`; for (let x=.88;x<=1.0001;x+=.01) tail += ` L${(x*W).toFixed(1)} ${f(x).toFixed(1)}`; tail += ` L${W} ${base} Z`;
  let line = ""; for (let x=0;x<=1.0001;x+=.01) line += (x?" L":"M") + (x*W).toFixed(1) + " " + f(x).toFixed(1);
  const dots = markers.map((m,i) => {
    const x = Math.min(W-7, Math.max(7, m.p*W)), y = f(m.p), last = i === markers.length-1;
    return `<circle cx="${x}" cy="${y}" r="${last?7:3.5}" fill="${m.p>=.88?"var(--tail)":"var(--accent)"}" stroke="var(--surface)" stroke-width="${last?2.5:1}" opacity="${last?1:.55}"/>`;
  }).join("");
  $("curve").innerHTML = `<path d="${d}" fill="var(--curve-fill)"/><path d="${tail}" fill="var(--tail-fill)"/>
    <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2"/>
    <line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)" stroke-width="1.5"/>
    <text x="${.88*W+8}" y="${base-10}" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--tail)">LONG TAIL</text>${dots}`;
}

function renderHud(){
  $("score").textContent = S.score; $("round").textContent = S.round; $("best").textContent = Math.max(best, S.score);
  $("lives").innerHTML = [0,1,2].map(i => `<span class="life${i < S.lives ? "" : " lost"}"></span>`).join("");
  $("run").innerHTML = S.log.slice(-60).map(r => r.miss ? `<i class="x"></i>` : `<i class="${r.p>=.88?"t":""}" style="height:${6+28*r.p}px"></i>`).join("");
  drawCurve(S.log.filter(r => !r.miss).slice(-12));
}

function ask(){
  current = nextQ(); locked = false;
  $("meta").textContent = `Round ${S.round} · ${current.answers.length} answers on the list`;
  $("prompt").textContent = `Name a ${current.topic}.`;
  $("answer").value = ""; $("answer").disabled = false; $("pass").disabled = false;
  $("go").textContent = "Answer"; $("result").hidden = true;
  $("answer").focus();
}

function reveal(idx){
  const a = current.answers, n = a.length;
  const common = a.slice(0,3).map(x=>x.name).join(", ");
  const rare = a.slice(-3).filter((_,i,arr)=>a.indexOf(arr[i])!==idx).map(x=>x.name).join(", ");
  return `<p>Most common: <b>${common}</b></p><p>Deep in the tail: <b>${rare}</b></p>`;
}

function submit(){
  if (locked){ if (S.lives > 0) { S.round++; ask(); } return; }
  const val = $("answer").value.trim(); if (!val) return;
  const idx = match(current, val);
  const box = $("result");
  if (idx === null){
    S.lives--; S.log.push({miss:true});
    box.className = "result miss";
    box.innerHTML = `<div class="big">Not on the list</div><p>“${val.replace(/[<>&]/g,"")}” isn’t a ${current.topic} we know. −1 life.</p>${reveal(-1)}`;
    $("play").classList.remove("shake"); void $("play").offsetWidth; $("play").classList.add("shake");
  } else {
    const n = current.answers.length, p = n > 1 ? idx/(n-1) : 1, pts = pointsOf(p), tier = tierOf(p);
    S.score += pts; S.log.push({p, pts, name: current.answers[idx].name});
    if (!S.bestFind || p > S.bestFind.p) S.bestFind = {p, name: current.answers[idx].name, topic: current.topic};
    box.className = "result" + (p >= .88 ? " tail" : "");
    box.innerHTML = `<div class="big">${tier} · +${pts}</div><p><b>${current.answers[idx].name}</b> ranks ${idx+1} of ${n} by how often people think of it.</p>${reveal(idx)}`;
  }
  box.hidden = false; locked = true;
  $("answer").disabled = true; $("pass").disabled = true;
  renderHud();
  if (S.lives <= 0) return gameOver();
  $("go").textContent = "Next"; $("go").focus();
}

function pass(){
  if (locked) return;
  S.lives--; S.log.push({miss:true}); locked = true;
  const box = $("result"); box.className = "result miss";
  box.innerHTML = `<div class="big">Passed</div><p>−1 life.</p>${reveal(-1)}`; box.hidden = false;
  $("answer").disabled = true; $("pass").disabled = true;
  renderHud();
  if (S.lives <= 0) return gameOver();
  $("go").textContent = "Next"; $("go").focus();
}

function gameOver(){
  const isBest = S.score > best; if (isBest){ best = S.score; try { localStorage.setItem("longtail-best", best); } catch(e){} }
  const hits = S.log.filter(r=>!r.miss), tails = hits.filter(r=>r.p>=.88).length;
  const strip = S.log.map(r => r.miss ? "✕" : r.p>=.88 ? "◆" : r.p>=.45 ? "●" : "·").join("");
  const share = `Long Tail · ${S.score} pts · ${hits.length} answers · ${tails} in the long tail\n${strip}`;
  $("go").textContent = "Answer"; $("go").disabled = true;
  $("over").innerHTML = `<div class="eyebrow">Out of lives</div><h2>${S.score} points${isBest ? " · new best" : ""}</h2>
    <p class="hint" style="font-size:15px">${hits.length} correct answers, ${tails} in the long tail.${S.bestFind ? ` Rarest find: <b>${S.bestFind.name}</b> (${S.bestFind.topic}).` : ""}</p>
    <div class="row"><button type="button" id="again">Play again</button><button type="button" class="ghost" id="copy">Copy result</button></div>
    <pre id="sharetext" style="margin:0;font-family:var(--mono);font-size:13px;white-space:pre-wrap;color:var(--muted)">${share}</pre>`;
  $("over").hidden = false;
  $("again").onclick = start; $("again").focus();
  $("copy").onclick = () => {
    navigator.clipboard?.writeText(share).then(() => $("copy").textContent = "Copied")
      .catch(() => { const r = document.createRange(); r.selectNodeContents($("sharetext")); getSelection().removeAllRanges(); getSelection().addRange(r); $("copy").textContent = "Selected, press Ctrl+C"; });
  };
}

function start(){
  S = { score:0, round:1, lives:3, log:[], lastIdx:-1, bestFind:null };
  $("over").hidden = true; $("go").disabled = false;
  renderHud(); ask();
}

$("form").addEventListener("submit", e => { e.preventDefault(); submit(); });
$("pass").addEventListener("click", pass);
start();
</script>

</html>
